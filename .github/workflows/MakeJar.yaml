name: PowerXhost - Build Server

on:
  push:
    branches:
      - main
    paths:
      - 'Hosting/**'
      - 'WebSite/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/MakeJar.yaml'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PowerXhost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile Java
        run: gradle clean compileJava

      - name: Build executable JAR
        run: gradle shadowJar

      - name: Verify JAR
        run: |
          test -f build/libs/PowerXhost.jar
          jar tf build/libs/PowerXhost.jar
          echo "PowerXhost JAR built successfully!"

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerXhost-Server
          path: build/libs/PowerXhost.jar
          if-no-files-found: error
          retention-days: 30
