name: Build PowerXhost JAR

on:
  push:
    branches:
      - main
    paths:
      - 'Hosting/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/MakeJar.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PowerXhost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: gradle clean shadowJar

      - name: Verify JAR
        run: |
          test -f build/libs/PowerXhost.jar
          jar tf build/libs/PowerXhost.jar

      - name: Upload PowerXhost JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerXhost-JAR
          path: build/libs/PowerXhost.jar
          if-no-files-found: error
