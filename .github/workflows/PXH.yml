name: PowerXhost CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build PowerXhost
        run: gradle clean shadowJar

      - name: Verify JAR
        run: |
          test -f build/libs/PowerXhost.jar
          jar tf build/libs/PowerXhost.jar
          echo "JAR verified!"

      - name: Verify Website
        run: |
          test -f WebSite/index.html
          test -f WebSite/Style.css
          test -f WebSite/script.js
          echo "Website verified!"

      - name: Check JavaScript
        run: |
          node --check WebSite/script.js

      - name: Verify Android
        run: |
          test -f Android/settings.gradle.kts
          test -f Android/build.gradle.kts
          test -f Android/app/build.gradle.kts
          test -f Android/app/src/main/AndroidManifest.xml
          test -f Android/app/src/main/java/com/powerhost/MainActivity.java
          echo "Android verified!"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerXhost-CI
          path: build/libs/PowerXhost.jar
          if-no-files-found: error
