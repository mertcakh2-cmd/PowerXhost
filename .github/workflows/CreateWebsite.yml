name: PowerHost.co Website

on:
push:
branches:
- main
paths:
- 'WebSite/**'
- '.github/workflows/CreateWebsite.yml'

workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: github-pages
cancel-in-progress: true

jobs:
build:
name: Build PowerHost.co
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Verify website files
    run: |
      test -f WebSite/index.html
      test -f WebSite/Style.css
      test -f WebSite/script.js
      echo "Website files verified!"

  - name: Prepare website
    run: |
      mkdir -p _site
      cp -r WebSite/. _site/

      # Fix CSS filename capitalization
      cp WebSite/Style.css _site/style.css

      # Set custom domain
      echo "PowerHost.co" > _site/CNAME

      echo "PowerHost.co website prepared!"

  - name: Configure GitHub Pages
    uses: actions/configure-pages@v5

  - name: Upload website
    uses: actions/upload-pages-artifact@v3
    with:
      path: _site

deploy:
name: Deploy PowerHost.co
runs-on: ubuntu-latest
needs: build

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Publish website
    id: deployment
    uses: actions/deploy-pages@v4

  - name: Website deployed
    run: |
      echo "PowerHost.co deployment completed!"
      echo "Website URL: ${{ steps.deployment.outputs.page_url }}"
