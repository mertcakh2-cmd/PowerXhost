name: PowerHost.co Website Deployment

on:
push:
branches:
- main
paths:
- 'WebSite/**'
- '.github/workflows/CreateWebsite.yml'

workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: powerhost-website
cancel-in-progress: true

jobs:
deploy:
name: Deploy PowerHost.co
runs-on: ubuntu-latest

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Download website source
    uses: actions/checkout@v5

  - name: Prepare website files
    run: |
      mkdir -p public
      cp -r WebSite/. public/
      echo "PowerHost.co" > public/CNAME

  - name: Configure Pages
    uses: actions/configure-pages@v5

  - name: Upload website
    uses: actions/upload-pages-artifact@v3
    with:
      path: public

  - name: Deploy website
    id: deployment
    uses: actions/deploy-pages@v4
